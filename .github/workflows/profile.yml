name: Refresh public profile

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile.yml
      - scripts/update-profile.py

permissions:
  contents: read

concurrency:
  group: profile-telemetry
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'nunosousa-dev/nunosousa-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test snapshot generation
        run: python -m unittest discover -s tests -v
      - name: Fetch public snapshot
        run: python scripts/update-profile.py
      - name: Commit refreshed telemetry
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: refresh public profile snapshot'
          git push
